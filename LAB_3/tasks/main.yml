---
# tasks file for caddy_deploy

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
      - gnupg
    state: present

- name: Download Caddy repository GPG key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /tmp/caddy-stable.asc
    mode: "0644"

- name: Convert Caddy GPG key to keyring
  ansible.builtin.command:
    cmd: >
      gpg --dearmor --yes
      -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      /tmp/caddy-stable.asc
  args:
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Set Caddy keyring permissions
  ansible.builtin.file:
    path: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    mode: "0644"

- name: Add Caddy stable repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    state: present
    filename: caddy-stable

- name: Install Caddy webserver
  ansible.builtin.apt:
    name: caddy
    update_cache: yes
    state: present

- name: Create website directory
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    owner: root
    group: caddy
    mode: "0755"

- name: Copy custom index.html to web root
  ansible.builtin.copy:
    src: index.html
    dest: "{{ web_root }}/index.html"
    owner: root
    group: caddy
    mode: "0644"

- name: Create Caddy log directory
  ansible.builtin.file:
    path: /var/log/caddy/access.log
    state: touch
    owner: caddy
    group: caddy
    mode: "0644"

- name: Create Caddy configuration from template
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"

- name: Validate Caddy configuration
  ansible.builtin.command:
    cmd: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  changed_when: false

- name: Enable and reload Caddy service
  ansible.builtin.service:
    name: caddy
    enabled: yes
    state: restarted